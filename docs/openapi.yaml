        - type: object
          required: [user_ids]
          properties:
            user_ids:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: {$ref: '#/components/schemas/ProjectId'}
      unevaluatedProperties: false
    ProjectStageFields:
      type: object
