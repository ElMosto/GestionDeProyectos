openapi: 3.1.0
info:
  title: Gestión de Proyectos — Estudio Musical
  version: 0.6.0
  description: |
    API del sistema de gestión del estudio musical.

    Estado: fases 1-4. Autenticación, perfil, usuarios, clientes, proyectos,
    etapas, membresías, tareas, cargos, agenda propia de tareas, catálogos,
    ventas, pagos, anulaciones, reembolsos, ticket de venta, espacios, horarios,
    reservas, bloqueos y agenda propia de reservas.
    Reuniones, dashboard y gastos quedan para fases posteriores.

    Convenciones vinculantes (ver `docs/api-movil.md`):
    - Importes y cantidades como **string** decimal.
    - IDs como **string**.
    - Fechas ISO 8601 con zona; se almacenan en UTC.
    - Éxito: `{data, meta}`. Error: `{error:{code,message,fields},request_id}`.
    - Escrituras con `Idempotency-Key` cuando crean dinero o bloquean espacio.
    - En fase 1 las ediciones de usuarios/clientes exigen `version` en el cuerpo.
    - En fase 2 se exige version o expected_version en el cuerpo o If-Match;
      si se envían varios, deben coincidir. Versiones e IDs viajan como strings.
    - Las fechas sin hora son DATE YYYY-MM-DD (o null), sin conversión de zona.
      Los timestamps son ISO 8601 con zona UTC.
    - Los cambios de etapas, tareas y cargos incrementan también la versión del
      proyecto; los comentarios no. Recargar el proyecto antes de otra edición.
    - Con cookie, toda escritura exige X-CSRF-Token; con Bearer válido no.
    - `must_change_password` limita el acceso a identidad, CSRF, logout,
      avatar de lectura y cambio de contraseña hasta sustituir la clave temporal.

servers:
  - url: /api/v1
    description: Misma procedencia que el frontend

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: acceso
    description: Sesión web, perfil propio y dispositivos móviles (§5, §6, D-08)
  - name: sistema
    description: Estado del servicio
  - name: usuarios
    description: Administración de cuentas y directorio mínimo (§5)
  - name: clientes
    description: Clientes NORMAL/BANDA y recorte de campos sensibles (§7)
  - name: proyectos
    description: Proyectos, membresías, etapas y cargos; finanzas solo ADMIN o líder dueño (§8)
  - name: tareas
    description: Tareas de proyecto, independientes y comentarios (§8)
  - name: agenda
    description: Proyecciones propias paginadas; /agenda conserva tareas y /agenda/reservations añade reservas (§13)
  - name: catalogo
    description: Productos y extras; lectura autenticada, gestión solo ADMIN (§10)
  - name: ventas
    description: Ventas propias o todas para ADMIN; snapshots al emitir (§10)
  - name: pagos
    description: Ledger único de ventas y proyectos; anulación y reembolso solo ADMIN (§11)
  - name: espacios
    description: Espacios, horarios locales IANA y calendario mínimo de ocupaciones (§12)
  - name: reservas
    description: Reservas BANDA propias; ADMIN ve todas. Una sola venta por reserva (§12, D-20–23)

paths:
  /auth/csrf:
    get:
      tags: [acceso]
      operationId: getCsrfToken
      summary: Obtener token CSRF de la sesión web
      security: []
      responses:
        '200':
          description: Inicia una sesión si no existe; conserva el token al rotar la cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [token]
                    properties:
                      token: {type: string, minLength: 64, maxLength: 64}
  /auth/login:
    post:
      tags: [acceso]
      operationId: login
      summary: Iniciar sesión con correo y contraseña
      description: |
        Exige cookie obtenida en /auth/csrf y X-CSRF-Token. Rota el ID de sesión.
        Cuenta inexistente, inactiva o contraseña incorrecta producen el mismo 401.
        No existe endpoint de registro público.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, writeOnly: true}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/logout:
    post:
      tags: [acceso]
      operationId: logout
      summary: Cerrar sesión o revocar el token Bearer utilizado
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Sesión destruida o token revocado.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
  /auth/me:
    get:
      tags: [acceso]
      operationId: getIdentity
      summary: Identidad y capacidades de la cuenta autenticada
      description: |
        capabilities es un mapa plano acción → boolean para gatear UI, nunca una
        autorización. En fase 4 incluye acciones de espacios y reservas, por ejemplo
        spaces.manage, spaces.viewOccupancy, reservations.create,
        reservations.viewOwn, reservations.rescheduleOwn, reservations.cancelAny
        y reservations.retroactive. Ver calendario general no concede acceso al DTO
        de reserva ajena; cancelar reserva exige ADMIN por D-23. Mismo mapa con Bearer.
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me:
    get:
      tags: [acceso]
      operationId: getOwnProfile
      summary: Consultar el perfil propio
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
    patch:
      tags: [acceso]
      operationId: updateOwnProfile
      summary: Editar datos y preferencias del perfil propio
      description: Rechaza correo, rol, estado, permisos y cualquier campo desconocido.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                phone: {type: [string, 'null'], maxLength: 32}
                job_title: {type: [string, 'null'], maxLength: 120}
                timezone: {type: string, description: Identificador IANA.}
                notification_prefs:
                  type: [object, 'null']
                  additionalProperties: {type: boolean}
                  maxProperties: 20
                version: {type: string, pattern: '^[1-9][0-9]*$'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/password:
    post:
      tags: [acceso]
      operationId: changeOwnPassword
      summary: Cambiar contraseña verificando la actual
      description: |
        Permite salir del cambio obligatorio. Revoca todos los tokens móviles y
        rota la sesión web actual. No promete invalidar otras sesiones web.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, writeOnly: true}
                new_password: {type: string, minLength: 12, writeOnly: true}
                new_password_confirmation: {type: string, writeOnly: true}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/avatar:
    get:
      tags: [acceso]
      operationId: getOwnAvatar
      summary: Leer el avatar privado de la cuenta autenticada
      responses:
        '200':
          description: Imagen reprocesada de 512 × 512 con Cache-Control privado.
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [acceso]
      operationId: uploadOwnAvatar
      summary: Subir avatar JPG, PNG o WebP
      description: Máximo 2 MiB; MIME real y reprocesamiento con GD. SVG y ejecutables rechazados.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/tokens:
    get:
      tags: [acceso]
      operationId: listOwnTokens
      summary: Listar dispositivos propios sin token ni hash
      responses:
        '200':
          description: Dispositivos no revocados de la cuenta autenticada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DeviceToken'}
                  meta:
                    type: object
                    properties:
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
    post:
      tags: [acceso]
      operationId: issueOwnToken
      summary: Vincular un dispositivo y mostrar token una sola vez
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Token opaco de 32 bytes base64url; en BD solo se guarda SHA-256.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, name, token, token_type, expires_at]
                    properties:
                      id: {type: string}
                      name: {type: string}
                      token: {type: string}
                      token_type: {type: string, const: Bearer}
                      expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/tokens/{id}:
    delete:
      tags: [acceso]
      operationId: revokeOwnToken
      summary: Revocar un dispositivo propio
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
      responses:
        '204': {description: Token revocado; usarlo otra vez devuelve 401.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /health:
    get:
      tags: [sistema]
      summary: Estado del servicio
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, time]
                    properties:
                      status:
                        type: string
                        const: ok
                      time:
                        type: string
                        format: date-time
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string

  /users:
    get:
      tags: [usuarios]
      summary: Listar usuarios
      description: |
        Requiere `users.manage` (solo ADMINISTRADOR). Lista paginada con filtros
        `q` (nombre o correo), `role` (código) y `active` (0/1). El orden solo
        admite `name`, `created_at` y `last_login_at`.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Texto libre sobre nombre o correo.
          schema:
            type: string
            maxLength: 120
        - name: role
          in: query
          description: Código de rol.
          schema:
            type: string
            enum: [ADMINISTRADOR, LIDER_PROYECTO, COLABORADOR]
        - name: active
          in: query
          description: 1 = activos, 0 = desactivados.
          schema:
            type: integer
            enum: [0, 1]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at, last_login_at]
            default: name
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Lista paginada de usuarios sin `password_hash`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [usuarios]
      summary: Crear cuenta
      description: |
        Requiere `users.manage`. El correo se normaliza a minúsculas y es único
        (`409 EMAIL_TAKEN`). La cuenta nace activa y con
        `must_change_password = 1`. La contraseña inicial debe cumplir
        `security.password_min_length` (12 por defecto).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /users/directory:
    get:
      tags: [usuarios]
      summary: Directorio mínimo de usuarios activos
      description: |
        Requiere `users.directory`. Cualquier usuario activo lo consulta para
        asignaciones e invitaciones. Solo devuelve `id`, `name`, `job_title` y
        `role.code`; nunca correo, teléfono ni estado de la cuenta.
      operationId: getUserDirectory
      responses:
        '200':
          description: Usuarios activos ordenados por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [usuarios]
      summary: Detalle de una cuenta
      description: Requiere `users.manage`. Nunca devuelve `password_hash`.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Cuenta encontrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [usuarios]
      summary: Editar cuenta o cambiar rol
      description: |
        Requiere `users.manage`. Edita nombre, teléfono, cargo, zona horaria y rol.
        El propio actor no puede cambiar su rol. Un cambio de rol audita
        `ROLE_CHANGE` y respeta al último administrador activo
        (`409 LAST_ADMIN_PROTECTED`). `version` es obligatoria; una versión
        desactualizada devuelve `409 VERSION_CONFLICT`.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Cuenta actualizada; `version` incrementada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /users/{id}/deactivate:
    post:
      tags: [usuarios]
      summary: Desactivar cuenta
      description: |
        Requiere `users.manage`. Baja lógica idempotente: revoca los tokens del
        usuario y las sesiones abiertas dejan de valer en la siguiente petición.
        El último administrador activo no se puede desactivar
        (`409 LAST_ADMIN_PROTECTED`). Audita `USER_DEACTIVATE`.
      operationId: deactivateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Cuenta desactivada (o ya estaba desactivada).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}/reactivate:
    post:
      tags: [usuarios]
      summary: Reactivar cuenta
      description: Requiere `users.manage`. Reactivación idempotente; audita `USER_REACTIVATE`.
      operationId: reactivateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Cuenta activa (o ya estaba activa).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/reset-password:
    post:
      tags: [usuarios]
      summary: Restablecer acceso con clave temporal
      description: |
        Requiere `users.manage`. Emite una clave temporal de un solo uso (20
        caracteres), fija `must_change_password = 1`, revoca los tokens móviles y
        audita `PASSWORD_RESET_BY_ADMIN`. La clave en claro solo aparece en esta
        respuesta: no se guarda ni se registra en la bitácora.
      operationId: resetUserPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Clave temporal emitida una sola vez.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TemporaryPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients:
    get:
      tags: [clientes]
      summary: Listar clientes
      description: |
        Requiere `clients.view`. El directorio mínimo (id, tipo, nombre, contacto,
        teléfono y estado) lo ve cualquier usuario activo. `email`, `address`,
        `notes`, `representative_name`, `created_by`, fechas y `version` solo se
        incluyen para ADMIN (`clients.viewSensitive`) o para el creador del
        registro. Nunca se devuelven notas ni dirección a un colaborador que no
        creó el cliente.
      operationId: listClients
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Texto libre sobre nombre, contacto, representante, teléfono o correo.
          schema:
            type: string
            maxLength: 120
        - name: type
          in: query
          schema:
            type: string
            enum: [NORMAL, BANDA]
        - name: active
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at, updated_at]
            default: name
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Lista paginada con recorte de campos por permiso.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [clientes]
      summary: Crear cliente
      description: |
        Requiere `clients.create` (cualquier usuario activo). Una BANDA exige
        `representative_name` y `phone`. Se devuelven advertencias de posibles
        duplicados por nombre normalizado, teléfono o correo en `meta.warnings`,
        sin bloquear el alta. `created_by` es el actor y `version` empieza en 1.
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Cliente creado; `meta.warnings` solo si hay posibles duplicados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /clients/{id}:
    get:
      tags: [clientes]
      summary: Detalle de un cliente
      description: |
        Requiere `clients.view`. Mismo recorte de campos que la lista. Si el
        cliente no es visible, responde 404.
      operationId: getClient
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [clientes]
      summary: Editar cliente
      description: |
        ADMIN (`clients.editAny`) puede editar todos los campos. El creador solo
        puede corregir datos de contacto de sus propios registros
        (`clients.editOwn`): `contact_name`, `phone`, `email`, `address` y
        `representative_name`. Un colaborador no creador recibe 403. `type` solo
        lo cambia ADMIN. `version` es obligatoria y una versión desactualizada
        devuelve 409. Audita `CLIENT_UPDATE` con before/after de los campos
        cambiados. Convertir BANDA → NORMAL con reservas futuras activas devuelve
        `409 CLIENT_HAS_FUTURE_RESERVATIONS`.
      operationId: updateClient
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        '200':
          description: Cliente actualizado; `version` incrementada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /clients/{id}/deactivate:
    post:
      tags: [clientes]
      summary: Desactivar cliente
      description: |
        Requiere `clients.deactivate` (solo ADMIN). Baja lógica: no borra ni
        elimina historia. Si el cliente tiene reservas futuras activas responde
        `409 CLIENT_HAS_FUTURE_RESERVATIONS`. Audita `CLIENT_DEACTIVATE`.
      operationId: deactivateClient
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Cliente desactivado (o ya estaba desactivado).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects:
    get:
      tags: [proyectos]
      operationId: listProjects
      summary: Listar proyectos visibles
      description: |
        ADMIN ve todos; LIDER_PROYECTO solo los que lidera; COLABORADOR solo
        aquellos de los que es miembro. Orden por ID descendente, sin sort libre.
        Notes, base_amount y financial_summary se omiten salvo ADMIN/líder dueño,
        tanto con cookie como con Bearer. Filtros SQL limitados a esta lista blanca.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ProjectSearch'
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/ProjectType'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ProjectStatus'}
        - name: leader_id
          in: query
          schema: {$ref: '#/components/schemas/ProjectId'}
        - name: client_id
          in: query
          schema: {$ref: '#/components/schemas/ProjectId'}
      responses:
        '200': {$ref: '#/components/responses/ProjectPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [proyectos]
      operationId: createProject
      summary: Crear proyecto en BORRADOR
      description: |
        ADMIN selecciona líder activo LIDER_PROYECTO; un líder solo crea bajo su
        liderazgo. EXTERNO exige cliente activo, importe positivo y billable=true.
        INTERNO permite cero y no cobrable por defecto. Moneda MXN.
        Idempotency-Key obligatorio cuando se crea con valor comercial/importe;
        se admite también para altas sin valor. Misma clave, actor, operación y
        contenido devuelve el resultado original sin duplicar; contenido distinto
        produce 409 IDEMPOTENCY_KEY_REUSED. Efecto y resultado son transaccionales.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIdempotencyConditional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
            example: {name: Grabación EP, description: Producción musical, type: EXTERNO, leader_id: '2', client_id: '1', billable: true, base_amount: '1500.00'}
      responses:
        '201': {$ref: '#/components/responses/ProjectResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [proyectos]
      operationId: getProject
      summary: Consultar proyecto visible
      description: Mismo recorte financiero que la lista. Un ID ajeno no concede acceso; 404 sin importes.
      responses:
        '200': {$ref: '#/components/responses/ProjectResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [proyectos]
      operationId: updateProject
      summary: Editar proyecto sin modificar su estado
      description: |
        Solo ADMIN/líder dueño. Requiere versión del proyecto mediante version,
        expected_version o If-Match; si hay varios, deben coincidir (422 si no).
        Proyecto terminal exige reapertura (409 PROJECT_CLOSED).
        Cambios financieros (base_amount, billable, client_id o type) requieren
        Idempotency-Key; la edición no financiera no lo exige. Con cobros, ajustes
        comerciales solo ADMIN y total nunca inferior al neto cobrado
        (409 TOTAL_BELOW_PAID). No modifica pagos ni gastos. Fechas contienen a
        todas las etapas/tareas. Cliente activo para nuevas operaciones comerciales.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
        - $ref: '#/components/parameters/ProjectIdempotencyConditional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectUpdate'}
            example: {version: '1', name: Grabación EP revisada}
      responses:
        '200': {$ref: '#/components/responses/ProjectResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}/transitions:
    post:
      tags: [proyectos]
      operationId: transitionProject
      summary: Cambiar estado o reabrir proyecto
      description: |
        Solo ADMIN/líder dueño. Versión del proyecto obligatoria en cuerpo o If-Match;
        múltiples fuentes deben coincidir. BORRADOR→PLANIFICADO→EN_CURSO↔PAUSADO;
        EN_CURSO/PAUSADO→FINALIZADO. Cualquier no terminal→CANCELADO exige reason.
        Finalizar exige todas las tareas obligatorias COMPLETADA, incluidas las
        canceladas; excepción solo ADMIN con exception=true y reason no vacío.
        Reabrir FINALIZADO/CANCELADO→EN_CURSO solo ADMIN y con reason.
        Finalizar no liquida pagos ni crea cobros.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectTransition'}
            example: {expected_version: '2', status: PLANIFICADO}
      responses:
        '200': {$ref: '#/components/responses/ProjectResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [proyectos]
      operationId: listProjectMembers
      summary: Consultar integrantes del proyecto visible
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/ProjectMemberPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    put:
      tags: [proyectos]
      operationId: replaceProjectMembers
      summary: Reemplazar lista completa de integrantes
      description: |
        Solo ADMIN/líder dueño; usuarios activos, sin duplicados, máximo 1000 IDs.
        Versión del proyecto obligatoria en cuerpo o If-Match; fuentes coincidentes.
        No retirar un asignado a tarea no cancelada (409 MEMBER_HAS_TASKS).
        Respuesta paginada con los primeros 100 integrantes y meta.project_version;
        usar GET para páginas posteriores. Lista vacía retira todos si es válido.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectMembersReplace'}
            example: {version: '3', user_ids: ['3', '4']}
      responses:
        '200': {$ref: '#/components/responses/ProjectMemberPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}/stages:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [proyectos]
      operationId: listProjectStages
      summary: Listar etapas ordenadas del proyecto visible
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/ProjectStagePage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [proyectos]
      operationId: createProjectStage
      summary: Añadir etapa al proyecto
      description: Solo ADMIN/líder dueño; fechas contenidas en proyecto. Incrementa versión del proyecto.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectStageCreate'}
            example: {name: Preproducción, start_date: '2026-10-01', end_date: '2026-10-15'}
      responses:
        '201': {$ref: '#/components/responses/ProjectStageResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /stages/{id}:
    patch:
      tags: [proyectos]
      operationId: updateProjectStage
      summary: Editar etapa y validar fechas de descendientes
      description: |
        Solo ADMIN/líder dueño. Versión de la etapa en cuerpo o If-Match;
        fuentes coincidentes. Fechas dentro del proyecto y que contienen tareas.
        COMPLETADA exige tareas obligatorias completadas. Incrementa versión del proyecto.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectStageUpdate'}
      responses:
        '200': {$ref: '#/components/responses/ProjectStageResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}/stages/reorder:
    post:
      tags: [proyectos]
      operationId: reorderProjectStages
      summary: Reordenar conjunto completo de etapas
      description: |
        Solo ADMIN/líder dueño. Versión del proyecto en cuerpo o If-Match;
        fuentes coincidentes. stage_ids debe contener exactamente todas las etapas,
        sin duplicados, en el orden deseado. Respuesta con primeras 100 etapas,
        meta de paginación y project_version; consultar GET para el resto.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectStagesReorder'}
            example: {version: '4', stage_ids: ['2', '1']}
      responses:
        '200': {$ref: '#/components/responses/ProjectStagePage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /stages/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [tareas]
      operationId: listStageTasks
      summary: Listar tareas de etapa visible
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ProjectSearch'
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskAssigneeFilter'
      responses:
        '200': {$ref: '#/components/responses/TaskPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [tareas]
      operationId: createStageTask
      summary: Crear tarea asignada a colaborador miembro activo
      description: |
        Solo ADMIN/líder dueño. No admite project_id ni stage_id en cuerpo;
        proyecto derivado de la etapa. Fechas dentro de etapa y proyecto.
        Una etapa COMPLETADA/CANCELADA exige reapertura (409 STAGE_CLOSED).
        Incrementa versión del proyecto.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
            example: {title: Preparar sesión, assignee_id: '3', is_required: true}
      responses:
        '201': {$ref: '#/components/responses/TaskResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tasks:
    get:
      tags: [tareas]
      operationId: listTasks
      summary: Listar tareas visibles, propias por defecto
      description: |
        Sin assignee_id, stage_id ni project_id se aplica el usuario actual como
        responsable. Los filtros nunca amplían permisos por objeto. Independientes
        visibles solo para ADMIN o responsable. Orden por fin (null al final) e ID.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ProjectSearch'
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskAssigneeFilter'
        - name: project_id
          in: query
          schema: {$ref: '#/components/schemas/ProjectId'}
        - name: stage_id
          in: query
          schema: {$ref: '#/components/schemas/ProjectId'}
        - name: standalone
          in: query
          description: 1 solo independientes; 0 solo tareas de proyecto.
          schema: {type: string, enum: ['0', '1']}
      responses:
        '200': {$ref: '#/components/responses/TaskPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [tareas]
      operationId: getTask
      summary: Consultar tarea visible
      responses:
        '200': {$ref: '#/components/responses/TaskResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [tareas]
      operationId: updateTask
      summary: Editar tarea o actualizar progreso propio
      description: |
        Responsable solo puede editar progress; alcance, fechas y asignación solo
        ADMIN/líder dueño (independientes solo ADMIN). Versión de tarea en cuerpo
        o If-Match; fuentes coincidentes. No cambia estado ni pertenencia.
        Tarea terminal exige reapertura (409 TASK_CLOSED). Incrementa versión del
        proyecto cuando procede. Fechas y asignación revalidadas por servidor.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskUpdate'}
            example: {version: '1', progress: 50}
      responses:
        '200': {$ref: '#/components/responses/TaskResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tasks/{id}/transitions:
    post:
      tags: [tareas]
      operationId: transitionTask
      summary: Cambiar estado de tarea o reabrirla con motivo
      description: |
        ADMIN/líder dueño o responsable autorizado. Versión de tarea en cuerpo o
        If-Match; fuentes coincidentes. Completar fija progress=100 y fechas reales.
        Reabrir COMPLETADA/CANCELADA exige EN_CURSO y reason; restablece progreso
        a cero conservando historial. Repetir estado actual da INVALID_TRANSITION.
        Incrementa versión del proyecto; un proyecto cerrado impide la operación.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskTransition'}
            example: {version: '2', status: COMPLETADA}
      responses:
        '200': {$ref: '#/components/responses/TaskResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /standalone-tasks:
    post:
      tags: [tareas]
      operationId: createStandaloneTask
      summary: Crear tarea independiente, solo ADMIN
      description: Responsable activo de cualquier rol; no admite stage_id/project_id. Aparece en su agenda si tiene fechas.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
            example: {title: Revisar equipo, assignee_id: '2', start_date: '2026-10-28', end_date: '2026-10-28'}
      responses:
        '201': {$ref: '#/components/responses/TaskResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tasks/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [tareas]
      operationId: listTaskComments
      summary: Listar comentarios inmutables de tarea visible
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/TaskCommentPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [tareas]
      operationId: createTaskComment
      summary: Añadir comentario a tarea visible
      description: Autor y fecha del servidor. Inmutable; no incrementa versión ni exige versión esperada.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCommentCreate'}
            example: {body: Sesión preparada.}
      responses:
        '201': {$ref: '#/components/responses/TaskCommentResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}/charges:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [proyectos]
      operationId: listProjectCharges
      summary: Consultar cargos internos del proyecto
      description: Solo ADMIN/líder dueño; un colaborador recibe 403 sin importes ni resumen.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/ProjectChargePage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [proyectos]
      operationId: createProjectCharge
      summary: Añadir cargo a proyecto INTERNO
      description: |
        Solo ADMIN/líder dueño. Idempotency-Key obligatorio; repetición idéntica
        devuelve resultado original, contenido distinto da IDEMPOTENCY_KEY_REUSED.
        Cantidad string de tres decimales, precio string de dos; amount calculado
        con redondeo por partida. No registra pago ni gasto. Incrementa versión
        del proyecto. Ajustes con cobros solo ADMIN.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectChargeCreate'}
            example: {concept: Edición adicional, quantity: '1.000', unit_price: '500.00', charge_date: '2026-10-28'}
      responses:
        '201': {$ref: '#/components/responses/ProjectChargeResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /project-charges/{id}:
    patch:
      tags: [proyectos]
      operationId: updateProjectCharge
      summary: Corregir o anular cargo sin eliminar historial
      description: |
        Solo ADMIN/líder dueño, proyectos INTERNO. Idempotency-Key obligatorio.
        Versión del cargo en cuerpo o If-Match; fuentes coincidentes.
        Recalcula amount e incrementa versión del proyecto. Con cobros solo ADMIN;
        total nunca inferior al neto cobrado (TOTAL_BELOW_PAID).
        Anular no reembolsa ni elimina pagos/gastos.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
        - $ref: '#/components/parameters/ProjectIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectChargeUpdate'}
            example: {version: '1', status: ANULADO}
      responses:
        '200': {$ref: '#/components/responses/ProjectChargeResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ProjectConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /projects/{id}/payments:
    get:
      tags: [proyectos]
      operationId: listProjectPayments
      summary: Historial de pagos de proyecto
      description: |
        Solo ADMIN/líder dueño. meta.summary contiene resumen financiero calculado.
        Conserva la respuesta de fase 2. Sin importes en 403/404;
        no se confunde valor interno estimado con ingreso ni cuenta por cobrar.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/ProjectPaymentPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [pagos]
      operationId: registerProjectPayment
      summary: Registrar abono de proyecto cobrable
      description: |
        Solo ADMIN o líder propietario con permiso financiero; membresía no basta.
        Exige proyecto cobrable, no CANCELADO y cliente activo. FINALIZADO permite
        cobrar saldo. Bloquea documento y ledger, rechaza sobrepago e incrementa versión.
        La versión es opcional; si se aporta debe coincidir con el documento actual.
      parameters:
        - $ref: '#/components/parameters/ProjectResourceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
        - $ref: '#/components/parameters/PaymentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCreate'}
      responses:
        '201': {$ref: '#/components/responses/PaymentMutation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /agenda:
    get:
      tags: [agenda]
      operationId: getOwnTaskAgenda
      summary: Proyección de tareas propias en rango DATE
      description: |
        Solo tareas asignadas al solicitante, incluso con Bearer. Fase 2 no incluye
        reuniones ni reservas. Rango inclusivo from/to, fin no anterior al inicio,
        diferencia máxima 366 días. Sin fechas y CANCELADA no aparecen.
        Eventos de día completo con kind=TASK; no expone finanzas de proyectos.
        No permite consultar agendas ajenas cambiando assignee_id.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/TaskAgendaPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /products:
    get:
      tags: [catalogo]
      operationId: listProducts
      summary: Listar productos y servicios
      description: |
        Solo activos para no ADMIN, incluso si envía active=0. ADMIN puede consultar
        inactivos. Filtros permitidos limit, offset, q, active y type; orden nombre/id.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/CatalogSearch'
        - $ref: '#/components/parameters/CatalogActive'
        - name: type
          in: query
          schema: {type: string, enum: [PRODUCTO, SERVICIO]}
      responses:
        '200': {$ref: '#/components/responses/ProductPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [catalogo]
      operationId: createProduct
      summary: Crear producto o servicio (ADMIN)
      description: No exige Idempotency-Key. No descuenta inventario ni registra dinero.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductCreate'}
            example: {name: Grabación, type: SERVICIO, unit: hora, price: '500.00', active: true}
      responses:
        '201': {$ref: '#/components/responses/ProductResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [catalogo]
      operationId: getProduct
      summary: Consultar producto y extras vinculados
      description: No ADMIN recibe solo producto activo y extra_ids de extras activos.
      responses:
        '200': {$ref: '#/components/responses/ProductResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    patch:
      tags: [catalogo]
      operationId: updateProduct
      summary: Editar producto (ADMIN)
      description: |
        Exige version/expected_version o If-Match coherentes. No exige Idempotency-Key.
        Cambiar precio o nombre no altera snapshots de ventas emitidas.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      responses:
        '200': {$ref: '#/components/responses/ProductResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /products/{id}/extras:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    put:
      tags: [catalogo]
      operationId: replaceProductExtras
      summary: Reemplazar extras permitidos del producto (ADMIN)
      description: |
        Solo IDs de extras activos; lista vacía desvincula todos. Exige una fuente
        de versión coherente; no exige Idempotency-Key. No altera ventas emitidas.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [extra_ids]
              properties:
                version: {$ref: '#/components/schemas/ProjectVersion'}
                expected_version: {$ref: '#/components/schemas/ProjectVersion'}
                extra_ids:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/ProjectId'}
            example: {version: '1', extra_ids: ['1', '2']}
      responses:
        '200': {$ref: '#/components/responses/ProductResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /extras:
    get:
      tags: [catalogo]
      operationId: listExtras
      summary: Listar extras de catálogo
      description: Solo activos para no ADMIN; ADMIN incluye inactivos. Orden nombre/id.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/CatalogSearch'
        - $ref: '#/components/parameters/CatalogActive'
      responses:
        '200': {$ref: '#/components/responses/ExtraPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [catalogo]
      operationId: createExtra
      summary: Crear extra de catálogo (ADMIN)
      description: No exige Idempotency-Key; no registra dinero.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtraCreate'}
            example: {name: Edición adicional, price: '100.00', active: true}
      responses:
        '201': {$ref: '#/components/responses/ExtraResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /extras/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [catalogo]
      operationId: getExtra
      summary: Consultar extra de catálogo
      description: Un extra inactivo no es visible para no ADMIN.
      responses:
        '200': {$ref: '#/components/responses/ExtraResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    patch:
      tags: [catalogo]
      operationId: updateExtra
      summary: Editar extra (ADMIN)
      description: |
        Exige version/expected_version o If-Match coherentes, no Idempotency-Key.
        Las ventas emitidas mantienen su snapshot histórico.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtraUpdate'}
      responses:
        '200': {$ref: '#/components/responses/ExtraResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales:
    get:
      tags: [ventas]
      operationId: listSales
      summary: Listar ventas propias o todas para ADMIN
      description: |
        Orden id descendente. Lista solo campos escalares; sin items ni
        financial_summary. Los totales de borradores reflejan el catálogo vigente.
        Filtros con lista blanca; responsible_id solo para ADMIN, sin ampliar
        acceso por ID para otros roles. Mismo recorte con cookie o Bearer.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Búsqueda por folio.
          schema: {type: string, maxLength: 120}
        - name: status
          in: query
          schema: {type: string, enum: [BORRADOR, EMITIDA, CANCELADA]}
        - name: type
          in: query
          schema: {type: string, enum: [ORDINARIA, RESERVA]}
        - name: client_id
          in: query
          schema: {$ref: '#/components/schemas/ProjectId'}
        - name: responsible_id
          in: query
          description: Solo ADMIN; no concede acceso por objeto.
          schema: {$ref: '#/components/schemas/ProjectId'}
        - name: from
          in: query
          description: Inicio inclusivo de fecha de emisión UTC.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: Fin inclusivo de fecha de emisión UTC.
          schema: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/SalePage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [ventas]
      operationId: createSale
      summary: Crear borrador de venta ordinaria
      description: |
        Cualquier usuario activo crea venta propia; responsable es el actor actual.
        No admite responsible_id, currency, total ni precios de catálogo enviados
        por el cliente. type opcional solo ORDINARIA; RESERVA se coordina en fase 4.
        Puede crear borrador sin partidas; emitir exige al menos una.
        Concepto libre solo ADMIN; infracción produce 403 FORBIDDEN.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaleCreate'}
            example:
              client_id: '1'
              items:
                - product_id: '1'
                  quantity: '2.000'
                  extras: [{extra_id: '1', quantity_per_unit: '1.000'}]
      responses:
        '201': {$ref: '#/components/responses/SaleResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [ventas]
      operationId: getSale
      summary: Consultar venta con partidas y resumen financiero
      description: |
        Solo responsable actual o ADMIN. BORRADOR recalcula con catálogo vigente
        sin escribir; EMITIDA/CANCELADA conserva snapshots. No expone finanzas
        ajenas ni en errores, también con token móvil.
      responses:
        '200': {$ref: '#/components/responses/SaleResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    patch:
      tags: [ventas]
      operationId: updateSale
      summary: Editar borrador propio o de cualquier responsable para ADMIN
      description: |
        Solo client_id, notes e items; items reemplaza todas las partidas y exige
        Idempotency-Key. Sin items no exige clave. Siempre exige una versión
        coherente (cuerpo o If-Match). EMITIDA/CANCELADA da SALE_NOT_DRAFT.
        RESERVA no se edita por esta ruta (RESERVATION_MANAGED).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
        - $ref: '#/components/parameters/SaleEditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaleUpdate'}
      responses:
        '200': {$ref: '#/components/responses/SaleResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [ventas]
      operationId: issueSale
      summary: Emitir y congelar snapshots de venta ordinaria
      description: |
        Responsable o ADMIN. Exige borrador no vacío y una fuente de versión.
        Recalcula catálogo bajo lock, congela nombres/precios e issued_at.
        Redondeo half-up por partida al final; emisión nunca registra cobro.
        No admite mutar venta RESERVA por esta ruta.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinanceVersionInput'}
            example: {version: '2'}
      responses:
        '200': {$ref: '#/components/responses/SaleResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [ventas]
      operationId: cancelSale
      summary: Cancelar venta ordinaria (ADMIN)
      description: |
        D-18: motivo obligatorio, versión coherente y neto pagado cero.
        Neto positivo da PAYMENTS_REQUIRE_RESOLUTION; resolver ledger antes.
        No crea penalización, pago ni reembolso automático; conserva historial.
        RESERVA da RESERVATION_MANAGED y exige coordinación de fase 4.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaleCancel'}
            example: {version: '3', reason: Solicitud del cliente}
      responses:
        '200': {$ref: '#/components/responses/SaleResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [pagos]
      operationId: listSalePayments
      summary: Historial paginado de pagos de venta
      description: |
        Responsable actual o ADMIN, no por registrador. Incluye anulados;
        nunca expone clave idempotente ni su hash. No hay ruta paralela de cobro
        para reservas; sus cobros usan exclusivamente la venta vinculada.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/PaymentPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [pagos]
      operationId: registerSalePayment
      summary: Registrar abono de venta emitida
      description: |
        Solo responsable actual o ADMIN; venta EMITIDA. Bajo transacción bloquea
        documento, calcula saldo y rechaza sobrepago. Incrementa versión de venta.
        Versión opcional del documento, nunca permite editar totales desde pagos.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
        - $ref: '#/components/parameters/PaymentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCreate'}
            example: {amount: '100.00', method: EFECTIVO, effective_at: '2026-10-28T12:00:00-06:00'}
      responses:
        '201': {$ref: '#/components/responses/PaymentMutation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales/{id}/mark-paid:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [pagos]
      operationId: markSalePaid
      summary: Registrar exactamente el saldo pendiente de venta
      description: |
        Responsable actual o ADMIN, venta EMITIDA. Atajo del ledger bajo el mismo
        bloqueo que los abonos; no admite amount ni estado de pago manual.
        Saldo cero devuelve payment=null sin asiento ficticio; total cero muestra
        SIN_CARGO. La versión del documento es opcional.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
        - $ref: '#/components/parameters/PaymentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarkPaidInput'}
      responses:
        '200': {$ref: '#/components/responses/PaymentMutation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /payments/{id}/void:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [pagos]
      operationId: voidPayment
      summary: Anular pago erróneo con motivo (ADMIN)
      description: |
        No es reembolso real. Conserva asiento y auditoría; incrementa versión del
        documento. PAYMENT_HAS_REFUNDS impide anular con reembolsos efectivos;
        PAYMENT_VOIDED indica pago ya anulado. Versión opcional del documento origen.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
        - $ref: '#/components/parameters/PaymentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentVoidInput'}
      responses:
        '200': {$ref: '#/components/responses/PaymentMutation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /payments/{id}/refunds:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [pagos]
      operationId: listPaymentRefunds
      summary: Historial paginado de reembolsos del pago
      description: |
        Mismo permiso financiero sobre el documento actual que el historial de
        pagos (ADMIN/responsable de venta o ADMIN/líder dueño de proyecto).
        Incluye historial sin exponer claves ni hashes idempotentes.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': {$ref: '#/components/responses/RefundPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [pagos]
      operationId: refundPayment
      summary: Registrar devolución real vinculada al pago (ADMIN)
      description: |
        Motivo e importe positivo obligatorios. Límite = pago menos reembolsos
        efectivos. No admite pago anulado, no anula venta ni aplica tasas.
        Incrementa versión del documento; versión esperada opcional del origen.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FinanceIdempotencyKey'
        - $ref: '#/components/parameters/PaymentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundCreate'}
            example: {amount: '50.00', effective_at: '2026-10-28T18:00:00Z', reason: Devolución acordada}
      responses:
        '201': {$ref: '#/components/responses/PaymentMutation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/FinanceConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /sales/{id}/ticket:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [ventas]
      operationId: getSaleTicket
      summary: Vista HTML privada de impresión de venta
      description: |
        Excepción HTML al contrato JSON, sin scraping para móvil. Solo responsable
        actual o ADMIN, con cookie o Bearer; GET no exige CSRF. Usa datos autorizados
        de SaleService::ticketData y escapa HTML. CSS/script locales de impresión.
        Reimprimir no emite ni modifica dinero, aun cuando audita SALE_TICKET_VIEW.
        Comprobante interno MXN, no factura fiscal. paper inválido da 422 JSON.
        Si la venta procede de una reserva, puede añadir un bloque de impresión
        con espacio, intervalo, duración en minutos enteros y tarifa histórica
        como string decimal de dos posiciones. Es contenido HTML opcional, no
        cambia el contrato ni crea un endpoint JSON de ticket para móvil.
      parameters:
        - name: paper
          in: query
          schema: {type: string, enum: [80mm, A4], default: 80mm}
      responses:
        '200':
          description: HTML de impresión (80 mm o A4); no es un DTO JSON.
          content:
            text/html:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /spaces:
    get:
      tags: [espacios]
      operationId: listSpaces
      summary: Listar espacios con paginación
      description: |
        Lectura autenticada con cookie o Bearer. Lista blanca de filtros q, active,
        limit y offset. hourly_rate solo se incluye para ADMIN; no incluye hours
        de detalle. Ver todos los espacios no autoriza ver reservas ajenas.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ReservationSearch'
        - name: active
          in: query
          description: Filtrar activos (1) o inactivos (0).
          schema: {type: string, enum: ['0', '1']}
      responses:
        '200': {$ref: '#/components/responses/SpacePage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [espacios]
      operationId: createSpace
      summary: Crear espacio (ADMIN)
      description: |
        Exige tarifa explícita; no inventa horarios ni configura un espacio demo.
        Sin ventanas configuradas no hay disponibilidad. No crea ocupación.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpaceCreate'}
            example: {name: Sala principal, hourly_rate: '250.00', block_minutes: 30}
      responses:
        '201': {$ref: '#/components/responses/SpaceResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /spaces/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [espacios]
      operationId: getSpace
      summary: Consultar espacio y ventanas semanales
      description: Lectura autenticada; hourly_rate solo ADMIN, con el mismo recorte para Bearer.
      responses:
        '200': {$ref: '#/components/responses/SpaceResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [espacios]
      operationId: updateSpace
      summary: Editar configuración del espacio (ADMIN)
      description: |
        Versión del espacio obligatoria, por cuerpo o If-Match. Bloquea el espacio;
        rechaza desactivación o cambio de granularidad con ocupaciones futuras
        bloqueantes. Cambiar tarifa no altera snapshots de reservas existentes.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpaceUpdate'}
      responses:
        '200': {$ref: '#/components/responses/SpaceResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /spaces/{id}/hours:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    put:
      tags: [espacios]
      operationId: replaceSpaceHours
      summary: Sustituir ventanas semanales (ADMIN)
      description: |
        Versión del espacio obligatoria. Horas civiles en zona IANA configurada del
        estudio, no timestamps RFC 3339 ni zona personal. Sin ventanas no hay
        disponibilidad. Se permiten adyacentes y se rechazan solapadas. Dividir
        cruces de medianoche en dos filas; 24:00:00 es extremo final válido.
        Rechaza cambios con ocupaciones futuras bloqueantes. Las reglas DST se
        validan en servidor al resolver cada fecha; no se asume desfase fijo.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpaceHoursReplace'}
            example:
              version: '1'
              hours: [{weekday: 1, local_start_time: '09:00:00', local_end_time: '24:00:00'}]
      responses:
        '200': {$ref: '#/components/responses/SpaceResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /spaces/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [espacios]
      operationId: getSpaceAvailability
      summary: Consultar ventanas y ocupaciones mínimas en rango ISO
      description: |
        Rango obligatorio [from,to) de instantes con zona, positivo y máximo 31 días.
        windows son ventanas de apertura, no huecos garantizados ni reservas.
        Calendario de ocupaciones accesible a usuarios autenticados con datos mínimos,
        sin banda, responsable, notas privadas, tarifa, total ni saldo. No amplía
        permiso para consultar el DTO de una reserva ajena. guaranteed siempre false.
        Solo la escritura transaccional que toma el mutex del espacio y revalida
        space_occupancies garantiza exclusión; esta consulta/previsualización no.
      parameters:
        - $ref: '#/components/parameters/AvailabilityFrom'
        - $ref: '#/components/parameters/AvailabilityTo'
      responses:
        '200': {$ref: '#/components/responses/SpaceAvailabilityResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /reservations:
    get:
      tags: [reservas]
      operationId: listReservations
      summary: Listar reservas autorizadas
      description: |
        ADMIN ve todas; los demás solo aquellas de las que son responsables.
        Lista blanca q, status, band_client_id, space_id, from, to, limit y offset.
        from/to son instantes ISO con zona y filtran por solape [from,to), no DATE.
        No permite elegir responsable para ampliar acceso; sin contactos privados.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ReservationSearch'
        - $ref: '#/components/parameters/ReservationStatusFilter'
        - $ref: '#/components/parameters/ReservationSpaceFilter'
        - $ref: '#/components/parameters/ReservationBandFilter'
        - $ref: '#/components/parameters/ReservationFrom'
        - $ref: '#/components/parameters/ReservationTo'
      responses:
        '200': {$ref: '#/components/responses/ReservationPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [reservas]
      operationId: createReservation
      summary: Confirmar reserva y emitir su única venta
      description: |
        Solo actores autorizados a crear reservas. Cliente BANDA activo obligatorio;
        responsable = actor. Rechaza owner/responsible_id, status, type, sale_id,
        occupancy_id, tarifa, precio y total enviados por el cliente.
        Crea reserva/ocupación CONFIRMED y exactamente una venta RESERVA/EMITIDA con
        partida cantidad 1.000 y precio igual al total calculado. No registra pago.
        No existe BORRADOR persistido de reserva. Cobrar por sale_id, sin otro ledger.
        Exige segundos cero, extremos alineados al block_minutes del espacio desde
        medianoche local IANA del estudio y duración UTC múltiplo de ese bloque.
        No presupone 30 minutos para todos los espacios. Sin ventanas no hay hueco;
        extremos de ventanas DST ambiguos/inexistentes se rechazan.
        Retrospectivas solo ADMIN con reason auditado. Importe calculado en backend:
        tarifa histórica × minutos enteros / 60, redondeo único final a dos decimales.
        Idempotencia, autorización y mutex de espacio se comprueban en transacción;
        replay reautoriza acceso actual antes de devolver el resultado original.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationCreate'}
            example: {band_client_id: '12', space_id: '2', start_at: '2026-11-02T10:00:00-06:00', end_at: '2026-11-02T11:30:00-06:00', notes: Ensayo}
      responses:
        '201': {$ref: '#/components/responses/ReservationResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    get:
      tags: [reservas]
      operationId: getReservation
      summary: Consultar reserva propia o cualquier reserva como ADMIN
      description: |
        Reautoriza por objeto incluso con Bearer. Invisibles producen 404 sin datos
        financieros. El detalle añade financial_summary del ledger de su sale_id;
        no incluye contactos privados ni habilita acceso a la banda por conocer su ID.
      responses:
        '200': {$ref: '#/components/responses/ReservationResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [reservas]
      operationId: updateReservationNotes
      summary: Editar exclusivamente notas de reserva
      description: |
        Solo ADMIN o responsable autorizado. Versión de reserva obligatoria y clave
        idempotente también para notas. Rechaza horarios, espacio, responsable,
        estado, tarifa, precio, total y demás campos ajenos a esta operación.
        Nunca permite evitar el coordinador de reprogramación con un PATCH genérico.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationNotesUpdate'}
            example: {version: '1', notes: null}
      responses:
        '200': {$ref: '#/components/responses/ReservationResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /reservations/{id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [reservas]
      operationId: rescheduleReservation
      summary: Reprogramar bajo bloqueo y recalcular venta vinculada
      description: |
        Solo ADMIN o responsable autorizado según estado y reglas financieras;
        con cobros, un ajuste comercial exige ADMIN. Exige versión de reserva.
        Revalida horarios, estado y solapamiento bajo mutex de los espacios origen
        y destino en orden de ID. Mismo espacio conserva tarifa histórica; distinto
        espacio adopta tarifa vigente de destino (D-21). Backend recalcula total,
        que nunca puede ser inferior al neto cobrado. Mantiene IDs de reserva,
        ocupación, venta y partida, folio e issued_at. No registra pagos/reembolsos.
        Retrospectivas solo ADMIN con motivo; misma granularidad configurable de creación.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationReschedule'}
            example: {version: '1', space_id: '2', start_at: '2026-11-02T12:00:00-06:00', end_at: '2026-11-02T13:30:00-06:00'}
      responses:
        '200': {$ref: '#/components/responses/ReservationResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /reservations/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [reservas]
      operationId: transitionReservation
      summary: Iniciar o finalizar uso del espacio
      description: |
        ADMIN o responsable autorizado. Versión de reserva obligatoria.
        CONFIRMED → IN_PROGRESS → FINISHED; cancelación por su ruta dedicada.
        Estados públicos en inglés; etiquetas españolas pertenecen a presentación.
        CONFIRMED e IN_PROGRESS bloquean incluso sin pago; uso y cobro independientes.
        Sin caducidad automática ni cambio de estado financiero implícito.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationTransition'}
            example: {version: '2', status: IN_PROGRESS}
      responses:
        '200': {$ref: '#/components/responses/ReservationResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /reservations/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [reservas]
      operationId: cancelReservation
      summary: Cancelar reserva y venta coordinadamente (ADMIN)
      description: |
        Exclusivamente ADMIN, incluso sin pagos (D-23). Exige versión de reserva,
        reason auditado y neto cobrado cero. Si hay saldo cobrado, resolver antes por
        operaciones explícitas autorizadas de reembolso/anulación; no simular devolución
        anulando un pago efectivo. No reembolsa automáticamente ni inventa penalización.
        Bajo mutex cancela reserva/ocupación y venta sin borrar historia; libera espacio.
        No usar la cancelación aislada de ventas para una venta RESERVA.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationCancel'}
            example: {version: '3', reason: Cancelación solicitada y saldo resuelto}
      responses:
        '200': {$ref: '#/components/responses/ReservationResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /space-blocks:
    get:
      tags: [espacios]
      operationId: listSpaceBlocks
      summary: Listar bloqueos de mantenimiento (ADMIN)
      description: |
        Paginado; filtros permitidos space_id, status, from, to, limit y offset.
        from/to son instantes con zona y filtran por solape. Motivo solo ADMIN;
        el resto ve únicamente proyección mínima en calendario de disponibilidad.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ReservationSpaceFilter'
        - $ref: '#/components/parameters/ReservationStatusFilter'
        - $ref: '#/components/parameters/ReservationFrom'
        - $ref: '#/components/parameters/ReservationTo'
      responses:
        '200': {$ref: '#/components/responses/SpaceBlockPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [espacios]
      operationId: createSpaceBlock
      summary: Bloquear espacio por mantenimiento (ADMIN)
      description: |
        Crea ocupación MAINTENANCE/CONFIRMED en transacción idempotente con el mismo
        mutex y comprobación de conflictos que las reservas. No genera venta ni cobro.
        Rango positivo máximo 31 días y espacio activo; mantenimiento no depende
        de ventanas comerciales ni de la granularidad de reservas.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpaceBlockCreate'}
            example: {space_id: '2', start_at: '2026-11-03T10:00:00-06:00', end_at: '2026-11-03T11:00:00-06:00', reason: Mantenimiento}
      responses:
        '201': {$ref: '#/components/responses/SpaceBlockResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /space-blocks/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectResourceId'
    post:
      tags: [espacios]
      operationId: cancelSpaceBlock
      summary: Cancelar bloqueo y liberar ocupación (ADMIN)
      description: Versión del bloqueo obligatoria; cancelación bajo mutex, sin borrar historia.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ReservationIdempotencyKey'
        - $ref: '#/components/parameters/ProjectIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpaceBlockCancel'}
            example: {version: '1', reason: Mantenimiento concluido}
      responses:
        '200': {$ref: '#/components/responses/SpaceBlockResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReservationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /agenda/reservations:
    get:
      tags: [agenda]
      operationId: getOwnReservationAgenda
      summary: Agenda mínima de reservas propias en rango DATE
      description: |
        Solo reservas propias, incluso para ADMIN; excluye canceladas. from/to son
        DATE inclusivos interpretados en zona personal del actor, máximo 31 días,
        a diferencia del rango ISO de disponibilidad y listado de reservas.
        Lista blanca from, to, limit, offset. Paginación con total; title genérico
        incluye nombre del espacio, nunca banda, notas privadas, tarifa, total ni saldo.
        No permite consultar otro responsable. No modifica /agenda ni su contrato
        TASK/TASKS_PHASE_2; la UI fusiona explícitamente las proyecciones paginadas.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: from
          in: query
          required: true
          description: Primer día local inclusivo del rango visible.
          schema: {type: string, format: date}
          example: '2026-11-01'
        - name: to
          in: query
          required: true
          description: Último día local inclusivo; rango máximo 31 días.
          schema: {type: string, format: date}
          example: '2026-11-07'
      responses:
        '200': {$ref: '#/components/responses/ReservationAgendaPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gestion_session
      description: Sesión web. Requiere token CSRF en operaciones mutables.
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco de dispositivo (Android). Sin JWT.

  schemas:
    SpaceFields:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, 'null'], maxLength: 10000}
        hourly_rate: {$ref: '#/components/schemas/ProjectMoney'}
        block_minutes: {type: integer, minimum: 1, maximum: 1440, default: 30}
        active: {type: boolean, default: true}
    SpaceCreate:
      allOf:
        - $ref: '#/components/schemas/SpaceFields'
      required: [name, hourly_rate]
      unevaluatedProperties: false
    SpaceUpdate:
      allOf:
        - $ref: '#/components/schemas/SpaceFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
      description: Versión del espacio obligatoria en version, expected_version o If-Match; varias deben coincidir.
      unevaluatedProperties: false
    SpaceHour:
      type: object
      additionalProperties: false
      required: [weekday, local_start_time, local_end_time]
      description: |
        Ventana semiabierta civil del estudio. Fin posterior al inicio. No es
        RFC 3339 time (sin zona); 24:00:00 solo como final de jornada.
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: Día ISO; lunes 1 y domingo 7.}
        local_start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:00$'
          examples: ['09:00:00']
        local_end_time:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]:00|24:00:00)$'
          examples: ['24:00:00']
    SpaceHoursReplace:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          required: [hours]
          properties:
            hours:
              type: array
              maxItems: 100
              items: {$ref: '#/components/schemas/SpaceHour'}
      unevaluatedProperties: false
    Space:
      type: object
      additionalProperties: false
      required: [id, name, description, block_minutes, active, version]
      description: |
        DTO autorizado; tarifa opcional solo ADMIN, nunca para otras cuentas.
        hours se incluye solo en detalle. IDs/version strings; minutos enteros.
      properties:
        id: {$ref: '#/components/schemas/ProjectId'}
        name: {type: string}
        description: {type: [string, 'null']}
        block_minutes: {type: integer, minimum: 1, maximum: 1440}
        active: {type: boolean}
        version: {$ref: '#/components/schemas/ProjectVersion'}
        hourly_rate: {$ref: '#/components/schemas/ProjectMoney'}
        hours: {type: array, items: {$ref: '#/components/schemas/SpaceHour'}}
    ReservationStatus:
      type: string
      enum: [CONFIRMED, IN_PROGRESS, FINISHED, CANCELLED]
      description: No existe borrador persistido; solo CONFIRMED e IN_PROGRESS bloquean.
    SpaceInterval:
      type: object
      required: [start_at, end_at]
      properties:
        start_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        end_at: {$ref: '#/components/schemas/FinanceTimestamp'}
    SpaceCalendarOccupancy:
      allOf:
        - $ref: '#/components/schemas/SpaceInterval'
        - type: object
          required: [id, space_id, kind, status]
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            space_id: {$ref: '#/components/schemas/ProjectId'}
            kind: {type: string, enum: [RESERVATION, MAINTENANCE, MEETING]}
            status: {$ref: '#/components/schemas/ReservationStatus'}
      unevaluatedProperties: false
      description: Proyección estrictamente mínima, sin banda, notas, responsable ni campos financieros.
    SpaceAvailability:
      type: object
      additionalProperties: false
      required: [space_id, timezone, windows, occupancies, guaranteed]
      properties:
        space_id: {$ref: '#/components/schemas/ProjectId'}
        timezone: {type: string, description: Identificador IANA configurado del estudio., examples: [America/Mexico_City]}
        windows:
          type: array
          description: Ventanas de apertura recortadas al rango solicitado; no restan ocupaciones ni garantizan hueco.
          items:
            allOf:
              - $ref: '#/components/schemas/SpaceInterval'
            unevaluatedProperties: false
        occupancies:
          type: array
          items: {$ref: '#/components/schemas/SpaceCalendarOccupancy'}
        guaranteed: {type: boolean, const: false}
    ReservationScheduleFields:
      allOf:
        - $ref: '#/components/schemas/SpaceInterval'
        - type: object
          properties:
            space_id: {$ref: '#/components/schemas/ProjectId'}
            reason: {type: string, minLength: 1, maxLength: 255, description: Obligatorio para retrospectivas ADMIN; auditado.}
    ReservationCreate:
      allOf:
        - $ref: '#/components/schemas/ReservationScheduleFields'
        - type: object
          required: [band_client_id, space_id]
          properties:
            band_client_id: {$ref: '#/components/schemas/ProjectId'}
            notes: {type: [string, 'null'], maxLength: 10000}
      unevaluatedProperties: false
      description: Responsable, estado, tarifa, precio y total asignados exclusivamente por el servidor.
    ReservationReschedule:
      allOf:
        - $ref: '#/components/schemas/ReservationScheduleFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
      required: [space_id]
      unevaluatedProperties: false
      description: Exige versión de reserva por cuerpo o If-Match; no admite total ni tarifa enviados.
    ReservationNotesUpdate:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          required: [notes]
          properties:
            notes: {type: [string, 'null'], maxLength: 10000}
      unevaluatedProperties: false
    ReservationTransition:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          required: [status]
          properties:
            status: {type: string, enum: [IN_PROGRESS, FINISHED]}
            reason: {type: string, minLength: 1, maxLength: 255}
      unevaluatedProperties: false
    ReservationCancel:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 255}
      unevaluatedProperties: false
    Reservation:
      allOf:
        - $ref: '#/components/schemas/SpaceInterval'
        - type: object
          required: [id, occupancy_id, band_client_id, band_name, space_id, space_name, sale_id, responsible_id, hourly_rate_snapshot, total, status, notes, version, created_at, updated_at]
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            occupancy_id: {$ref: '#/components/schemas/ProjectId'}
            band_client_id: {$ref: '#/components/schemas/ProjectId'}
            band_name: {type: string}
            space_id: {$ref: '#/components/schemas/ProjectId'}
            space_name: {type: string}
            sale_id: {$ref: '#/components/schemas/ProjectId'}
            responsible_id: {$ref: '#/components/schemas/ProjectId'}
            hourly_rate_snapshot: {$ref: '#/components/schemas/ProjectMoney'}
            duration_minutes: {type: integer, minimum: 1, description: Duración real entre los instantes UTC en minutos.}
            total: {$ref: '#/components/schemas/ProjectMoney'}
            status: {$ref: '#/components/schemas/ReservationStatus'}
            notes: {type: [string, 'null']}
            version: {$ref: '#/components/schemas/ProjectVersion'}
            created_at: {$ref: '#/components/schemas/FinanceTimestamp'}
            updated_at: {$ref: '#/components/schemas/FinanceTimestamp'}
            financial_summary: {$ref: '#/components/schemas/FinancialSummary'}
      unevaluatedProperties: false
      description: |
        Solo ADMIN o responsable autorizado; campos financieros filtrados por objeto
        en servidor, también con Bearer. No se usa como evento de calendario general.
        Detalle añade financial_summary; sin contactos ni notas privadas del cliente.
    SpaceBlockCreate:
      allOf:
        - $ref: '#/components/schemas/SpaceInterval'
        - type: object
          required: [space_id, reason]
          properties:
            space_id: {$ref: '#/components/schemas/ProjectId'}
            reason: {type: string, minLength: 1, maxLength: 255}
      unevaluatedProperties: false
    SpaceBlockCancel:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          properties:
            reason: {type: string, minLength: 1, maxLength: 255}
      unevaluatedProperties: false
    SpaceBlock:
      allOf:
        - $ref: '#/components/schemas/SpaceInterval'
        - type: object
          required: [id, occupancy_id, space_id, status, reason, version]
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            occupancy_id: {$ref: '#/components/schemas/ProjectId'}
            space_id: {$ref: '#/components/schemas/ProjectId'}
            status: {$ref: '#/components/schemas/ReservationStatus'}
            reason: {type: string}
            version: {$ref: '#/components/schemas/ProjectVersion'}
      unevaluatedProperties: false
      description: DTO exclusivo ADMIN; no reutilizarlo para calendario mínimo.
    ReservationAgendaEntry:
      allOf:
        - $ref: '#/components/schemas/SpaceInterval'
        - type: object
          required: [id, reservation_id, kind, title, status, space_id]
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            reservation_id: {$ref: '#/components/schemas/ProjectId'}
            kind: {type: string, const: RESERVATION}
            title: {type: string, description: 'Título genérico con nombre de espacio, sin banda ni notas.'}
            status: {type: string, enum: [CONFIRMED, IN_PROGRESS, FINISHED]}
            space_id: {$ref: '#/components/schemas/ProjectId'}
      unevaluatedProperties: false
      description: Evento propio mínimo sin importes, datos de cliente ni notas privadas.
    FinanceVersionInput:
      type: object
      additionalProperties: false
      description: |
        Para catálogo/ventas se exige al menos version, expected_version o If-Match.
        En pagos las tres fuentes son opcionales. Si se aportan varias deben coincidir.
      properties:
        version: {$ref: '#/components/schemas/ProjectVersion'}
        expected_version: {$ref: '#/components/schemas/ProjectVersion'}
    FinanceVersionFields:
      type: object
      properties:
        version: {$ref: '#/components/schemas/ProjectVersion'}
        expected_version: {$ref: '#/components/schemas/ProjectVersion'}
    FinanceTimestamp:
      type: string
      format: date-time
      description: ISO 8601 con segundos y zona; salida normalizada a UTC Z.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$'
      examples: ['2026-10-28T18:00:00Z']
    FinanceNullableId:
      oneOf:
        - $ref: '#/components/schemas/ProjectId'
        - type: 'null'
    FinanceNullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/FinanceTimestamp'
        - type: 'null'
    ProductFields:
      type: object
      properties:
        sku: {type: [string, 'null'], minLength: 1, maxLength: 40}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: [string, 'null'], maxLength: 10000}
        type: {type: string, enum: [PRODUCTO, SERVICIO]}
        unit: {type: string, minLength: 1, maxLength: 32}
        price: {$ref: '#/components/schemas/ProjectMoney'}
        active: {type: boolean}
    ProductCreate:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
      required: [name, price]
      unevaluatedProperties: false
    ProductUpdate:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
      unevaluatedProperties: false
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            version: {$ref: '#/components/schemas/ProjectVersion'}
            created_at: {$ref: '#/components/schemas/FinanceTimestamp'}
            updated_at: {$ref: '#/components/schemas/FinanceTimestamp'}
            extra_ids:
              type: array
              description: Presente en detalle; para no ADMIN solo extras activos.
              items: {$ref: '#/components/schemas/ProjectId'}
    ExtraFields:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        price: {$ref: '#/components/schemas/ProjectMoney'}
        active: {type: boolean}
    ExtraCreate:
      allOf:
        - $ref: '#/components/schemas/ExtraFields'
      required: [name, price]
      unevaluatedProperties: false
    ExtraUpdate:
      allOf:
        - $ref: '#/components/schemas/ExtraFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
      unevaluatedProperties: false
    Extra:
      allOf:
        - $ref: '#/components/schemas/ExtraFields'
        - type: object
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            version: {$ref: '#/components/schemas/ProjectVersion'}
            created_at: {$ref: '#/components/schemas/FinanceTimestamp'}
            updated_at: {$ref: '#/components/schemas/FinanceTimestamp'}
    SaleExtraInput:
      type: object
      additionalProperties: false
      required: [extra_id, quantity_per_unit]
      properties:
        extra_id: {$ref: '#/components/schemas/ProjectId'}
        quantity_per_unit: {$ref: '#/components/schemas/ProjectQuantity'}
    SaleCatalogItemInput:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      description: |
        Producto y extras activos del catálogo; extras deben estar vinculados al
        producto y no repetirse. El servidor calcula nombre y precios.
      properties:
        product_id: {$ref: '#/components/schemas/ProjectId'}
        quantity: {$ref: '#/components/schemas/ProjectQuantity'}
        extras:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SaleExtraInput'}
    SaleFreeItemInput:
      type: object
      additionalProperties: false
      required: [product_id, name, unit_price, quantity]
      description: Solo ADMIN. product_id debe ser null; no admite extras libres ni de catálogo.
      properties:
        product_id: {type: 'null'}
        name: {type: string, minLength: 1, maxLength: 160}
        unit_price: {$ref: '#/components/schemas/ProjectMoney'}
        quantity: {$ref: '#/components/schemas/ProjectQuantity'}
        extras: {type: array, maxItems: 0, items: {}}
    SaleFields:
      type: object
      properties:
        client_id: {$ref: '#/components/schemas/FinanceNullableId'}
        notes: {type: [string, 'null'], maxLength: 10000}
        items:
          type: array
          maxItems: 200
          description: Reemplazo completo al editar; vacío permitido solo en borrador.
          items:
            oneOf:
              - $ref: '#/components/schemas/SaleCatalogItemInput'
              - $ref: '#/components/schemas/SaleFreeItemInput'
    SaleCreate:
      allOf:
        - $ref: '#/components/schemas/SaleFields'
        - type: object
          properties:
            type: {type: string, enum: [ORDINARIA]}
      unevaluatedProperties: false
    SaleUpdate:
      allOf:
        - $ref: '#/components/schemas/SaleFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
      unevaluatedProperties: false
    SaleCancel:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 255}
      unevaluatedProperties: false
    SaleExtraSnapshot:
      type: object
      properties:
        id: {$ref: '#/components/schemas/FinanceNullableId'}
        extra_id: {$ref: '#/components/schemas/FinanceNullableId'}
        name_snapshot: {type: string}
        quantity_per_unit: {$ref: '#/components/schemas/ProjectQuantity'}
        unit_price: {$ref: '#/components/schemas/ProjectMoney'}
    SaleItem:
      type: object
      description: |
        Importe = quantity × (unit_price + Σ quantity_per_unit × extra.unit_price).
        Aritmética exacta, escala interna 8 y half-up a dos decimales por partida.
      properties:
        id: {$ref: '#/components/schemas/FinanceNullableId'}
        product_id: {$ref: '#/components/schemas/FinanceNullableId'}
        name_snapshot: {type: string}
        quantity: {$ref: '#/components/schemas/ProjectQuantity'}
        unit_price: {$ref: '#/components/schemas/ProjectMoney'}
        line_total: {$ref: '#/components/schemas/ProjectMoney'}
        sort_order: {type: integer}
        extras:
          type: array
          items: {$ref: '#/components/schemas/SaleExtraSnapshot'}
    FinancialSummary:
      type: object
      description: |
        Calculado solo en backend desde PaymentLedger. net_paid = pagos válidos
        menos reembolsos efectivos. SIN_CARGO para total cero, sin pago ficticio.
        No cobrable siempre tiene balance cero y no cuenta como ingreso real.
      properties:
        total: {$ref: '#/components/schemas/ProjectMoney'}
        paid_amount: {$ref: '#/components/schemas/ProjectMoney'}
        refunded_amount: {$ref: '#/components/schemas/ProjectMoney'}
        net_paid: {$ref: '#/components/schemas/ProjectMoney'}
        balance: {$ref: '#/components/schemas/ProjectMoney'}
        payment_status: {type: string, enum: [NO_PAGADO, PARCIAL, PAGADO, SIN_CARGO]}
        billable: {type: boolean}
    SaleSummary:
      type: object
      description: Campos escalares de lista; importes visibles solo a responsable o ADMIN.
      properties:
        id: {$ref: '#/components/schemas/ProjectId'}
        folio: {type: string}
        type: {type: string, enum: [ORDINARIA, RESERVA]}
        client_id: {$ref: '#/components/schemas/FinanceNullableId'}
        responsible_id: {$ref: '#/components/schemas/ProjectId'}
        status: {type: string, enum: [BORRADOR, EMITIDA, CANCELADA]}
        issued_at: {$ref: '#/components/schemas/FinanceNullableTimestamp'}
        currency: {type: string, enum: [MXN]}
        total: {$ref: '#/components/schemas/ProjectMoney'}
        notes: {type: [string, 'null']}
        version: {$ref: '#/components/schemas/ProjectVersion'}
        created_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        updated_at: {$ref: '#/components/schemas/FinanceTimestamp'}
    Sale:
      allOf:
        - $ref: '#/components/schemas/SaleSummary'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/SaleItem'}
            financial_summary: {$ref: '#/components/schemas/FinancialSummary'}
    PaymentMethod:
      type: string
      enum: [EFECTIVO, TRANSFERENCIA, TARJETA, OTRO]
      description: Registro manual; nunca enviar números de tarjeta ni credenciales bancarias.
    PaymentFields:
      type: object
      properties:
        method: {$ref: '#/components/schemas/PaymentMethod'}
        effective_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        reference: {type: [string, 'null'], maxLength: 120}
        notes: {type: [string, 'null'], maxLength: 10000}
    PaymentCreate:
      allOf:
        - $ref: '#/components/schemas/PaymentFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          properties:
            amount:
              $ref: '#/components/schemas/ProjectMoney'
              description: Importe estrictamente positivo, dos decimales; cero no válido.
      required: [amount, effective_at, method]
      unevaluatedProperties: false
    MarkPaidInput:
      allOf:
        - $ref: '#/components/schemas/PaymentFields'
        - $ref: '#/components/schemas/FinanceVersionFields'
      required: [effective_at, method]
      unevaluatedProperties: false
    PaymentVoidInput:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          properties:
            reason: {type: string, minLength: 1, maxLength: 255}
      required: [reason]
      unevaluatedProperties: false
    RefundCreate:
      allOf:
        - $ref: '#/components/schemas/FinanceVersionFields'
        - type: object
          properties:
            amount:
              $ref: '#/components/schemas/ProjectMoney'
              description: Positivo y no mayor al importe aún no reembolsado.
            effective_at: {$ref: '#/components/schemas/FinanceTimestamp'}
            reason: {type: string, minLength: 1, maxLength: 255}
      required: [amount, effective_at, reason]
      unevaluatedProperties: false
    Payment:
      type: object
      description: |
        DTO por lista blanca; sin Idempotency-Key HTTP, clave almacenada ni hash.
        Exactamente un project_id o sale_id es no nulo. Historial conserva anulados.
      properties:
        id: {$ref: '#/components/schemas/ProjectId'}
        folio: {type: string}
        project_id: {$ref: '#/components/schemas/FinanceNullableId'}
        sale_id: {$ref: '#/components/schemas/FinanceNullableId'}
        amount: {$ref: '#/components/schemas/ProjectMoney'}
        effective_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        reference: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        status: {type: string, enum: [REGISTRADO, ANULADO]}
        registered_by: {$ref: '#/components/schemas/ProjectId'}
        voided_at: {$ref: '#/components/schemas/FinanceNullableTimestamp'}
        voided_by: {$ref: '#/components/schemas/FinanceNullableId'}
        void_reason: {type: [string, 'null']}
        version: {$ref: '#/components/schemas/ProjectVersion'}
        created_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        updated_at: {$ref: '#/components/schemas/FinanceTimestamp'}
    Refund:
      type: object
      description: |
        Devolución real del pago original, sin clave ni hash idempotente.
        No tiene medio/referencia separados; el medio pertenece al pago original.
        No existe endpoint de anulación de reembolsos en fase 3.
      properties:
        id: {$ref: '#/components/schemas/ProjectId'}
        folio: {type: string}
        payment_id: {$ref: '#/components/schemas/ProjectId'}
        amount: {$ref: '#/components/schemas/ProjectMoney'}
        effective_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        reason: {type: string}
        status: {type: string, enum: [REGISTRADO, ANULADO]}
        registered_by: {$ref: '#/components/schemas/ProjectId'}
        voided_at: {$ref: '#/components/schemas/FinanceNullableTimestamp'}
        voided_by: {$ref: '#/components/schemas/FinanceNullableId'}
        version: {$ref: '#/components/schemas/ProjectVersion'}
        created_at: {$ref: '#/components/schemas/FinanceTimestamp'}
        updated_at: {$ref: '#/components/schemas/FinanceTimestamp'}
    PaymentMutationResult:
      type: object
      properties:
        payment:
          oneOf:
            - $ref: '#/components/schemas/Payment'
            - type: 'null'
        refund:
          oneOf:
            - $ref: '#/components/schemas/Refund'
            - type: 'null'
        document:
          type: object
          description: Documento origen y su versión posterior al movimiento.
          properties:
            kind: {type: string, enum: [sale, project]}
            id: {$ref: '#/components/schemas/ProjectId'}
            version: {$ref: '#/components/schemas/ProjectVersion'}
        financial_summary: {$ref: '#/components/schemas/FinancialSummary'}
    ProjectId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Identificador positivo, máximo 9223372036854775807; siempre string en JSON.
      examples: ['1']
    ProjectVersion:
      type: string
      pattern: '^[1-9][0-9]{0,9}$'
      description: Versión positiva, máximo 4294967295; siempre string en JSON.
      examples: ['1']
    ProjectMoney:
      type: string
      pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
      description: Importe decimal exacto no negativo, nunca número JSON.
      examples: ['1500.00']
    ProjectQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]{0,6})\.[0-9]{3}$'
      description: Cantidad decimal exacta estrictamente positiva (0.000 no válido).
      examples: ['1.000']
    ProjectDate:
      type: [string, 'null']
      format: date
      description: Fecha de calendario real YYYY-MM-DD sin hora/zona; null elimina la fecha.
    ProjectType:
      type: string
      enum: [INTERNO, EXTERNO]
    ProjectStatus:
      type: string
      enum: [BORRADOR, PLANIFICADO, EN_CURSO, PAUSADO, FINALIZADO, CANCELADO]
    ProjectPriority:
      type: string
      enum: [BAJA, MEDIA, ALTA, URGENTE]
    ProjectStageStatus:
      type: string
      enum: [PENDIENTE, EN_CURSO, COMPLETADA, CANCELADA]
    TaskStatus:
      type: string
      enum: [PENDIENTE, EN_CURSO, BLOQUEADA, COMPLETADA, CANCELADA]
    ProjectChargeStatus:
      type: string
      enum: [ACTIVO, ANULADO]
    ProjectVersionFields:
      type: object
      description: |
        Obligatorio al menos uno entre version, expected_version e If-Match.
        Todos los valores presentes deben coincidir; ausencia o desacuerdo da
        422 VALIDATION_FAILED; versión obsoleta da 409 VERSION_CONFLICT.
        El header se documenta por operación; puede enviarse sin campos de versión.
      properties:
        version: {$ref: '#/components/schemas/ProjectVersion'}
        expected_version: {$ref: '#/components/schemas/ProjectVersion'}
    ProjectFields:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 10000}
        type: {$ref: '#/components/schemas/ProjectType'}
        leader_id: {$ref: '#/components/schemas/ProjectId'}
        client_id:
          oneOf:
            - $ref: '#/components/schemas/ProjectId'
            - {type: 'null'}
        billable: {type: boolean}
        base_amount: {$ref: '#/components/schemas/ProjectMoney'}
        priority: {$ref: '#/components/schemas/ProjectPriority'}
        planned_start: {$ref: '#/components/schemas/ProjectDate'}
        planned_end: {$ref: '#/components/schemas/ProjectDate'}
        actual_start: {$ref: '#/components/schemas/ProjectDate'}
        actual_end: {$ref: '#/components/schemas/ProjectDate'}
        notes: {type: [string, 'null'], minLength: 1, maxLength: 10000}
    ProjectCreate:
      allOf:
        - $ref: '#/components/schemas/ProjectFields'
      unevaluatedProperties: false
      required: [name, description, type]
      description: |
        Estado BORRADOR y moneda MXN del servidor. Líder por defecto el solicitante;
        ADMIN debe seleccionar líder LIDER_PROYECTO activo. base_amount por defecto
        0.00, priority MEDIA, fechas/client_id/notes null; billable por defecto
        true en EXTERNO, false en INTERNO. Texto no vacío tras trim.
    ProjectUpdate:
      allOf:
        - $ref: '#/components/schemas/ProjectFields'
        - $ref: '#/components/schemas/ProjectVersionFields'
      unevaluatedProperties: false
      description: Campos parciales; status, currency, folio y campos calculados no editables aquí.
    ProjectProgress:
      type: object
      required: [task_count, completed_tasks, has_tasks, progress]
      properties:
        task_count: {type: integer, minimum: 0, description: Tareas no canceladas.}
        completed_tasks: {type: integer, minimum: 0}
        has_tasks: {type: boolean}
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Parte entera de completadas/no canceladas por 100; cero sin tareas.
    ProjectFinancialSummary:
      type: object
      description: |
        Solo ADMIN/líder dueño. Total=base+cargos activos; neto=cobros registrados
        menos reembolsos registrados. No incluye gastos. INTERNO no cobrable es
        valor estimado, no ingreso ni cuenta por cobrar; su balance es 0.00.
      required: [base_amount, charges_total, total, paid_amount, refunded_amount, net_paid, balance, payment_status, billable, value_kind]
      properties:
        base_amount: {$ref: '#/components/schemas/ProjectMoney'}
        charges_total: {$ref: '#/components/schemas/ProjectMoney'}
        total: {$ref: '#/components/schemas/ProjectMoney'}
        paid_amount: {$ref: '#/components/schemas/ProjectMoney'}
        refunded_amount: {$ref: '#/components/schemas/ProjectMoney'}
        net_paid: {$ref: '#/components/schemas/ProjectMoney'}
        balance: {$ref: '#/components/schemas/ProjectMoney'}
        payment_status: {type: string, enum: [SIN_CARGO, NO_PAGADO, PARCIAL, PAGADO]}
        billable: {type: boolean}
        value_kind: {type: string, enum: [COMERCIAL, VALOR_INTERNO_ESTIMADO]}
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectProgress'
        - type: object
          required: [id, folio, type, client_id, leader_id, name, description, status, priority, planned_start, planned_end, actual_start, actual_end, currency, version, billable, created_at, updated_at]
          properties:
            id: {$ref: '#/components/schemas/ProjectId'}
            folio: {type: string}
            type: {$ref: '#/components/schemas/ProjectType'}
            client_id:
              oneOf:
                - $ref: '#/components/schemas/ProjectId'
                - {type: 'null'}
            leader_id: {$ref: '#/components/schemas/ProjectId'}
            name: {type: string}
            description: {type: string}
            status: {$ref: '#/components/schemas/ProjectStatus'}
            priority: {$ref: '#/components/schemas/ProjectPriority'}
            planned_start: {$ref: '#/components/schemas/ProjectDate'}
            planned_end: {$ref: '#/components/schemas/ProjectDate'}
            actual_start: {$ref: '#/components/schemas/ProjectDate'}
            actual_end: {$ref: '#/components/schemas/ProjectDate'}
            currency: {type: string, const: MXN}
            version: {$ref: '#/components/schemas/ProjectVersion'}
            billable: {type: boolean}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            notes: {type: [string, 'null'], description: Omitido salvo ADMIN/líder dueño.}
            base_amount:
              $ref: '#/components/schemas/ProjectMoney'
              description: Omitido salvo ADMIN/líder dueño.
            financial_summary:
              $ref: '#/components/schemas/ProjectFinancialSummary'
              description: Omitido salvo ADMIN/líder dueño; nunca se envía vacío a colaboradores.
      description: Recorte sensible idéntico con sesión y con token opaco; no depende del cliente.
    ProjectTransition:
      allOf:
        - $ref: '#/components/schemas/ProjectVersionFields'
        - type: object
          required: [status]
          properties:
            status: {$ref: '#/components/schemas/ProjectStatus'}
            reason: {type: [string, 'null'], minLength: 1, maxLength: 2000}
            exception: {type: boolean}
      unevaluatedProperties: false
    ProjectMember:
      type: object
      required: [user_id, name, role, active, created_at]
      properties:
        user_id: {$ref: '#/components/schemas/ProjectId'}
        name: {type: string}
        role: {type: string, enum: [ADMINISTRADOR, LIDER_PROYECTO, COLABORADOR]}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
    ProjectMembersReplace:
      allOf:
