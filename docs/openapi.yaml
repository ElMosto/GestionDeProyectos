          required: [all_day, kind]
          properties:
            all_day: {type: boolean, const: true}
            kind: {type: string, const: TASK}
    ProjectPaginationMeta:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [project_version]
          properties:
            project_version: {$ref: '#/components/schemas/ProjectVersion'}
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, capabilities, must_change_password]
          properties:
            user: {$ref: '#/components/schemas/User'}
            capabilities:
              type: object
              additionalProperties: {type: boolean}
            must_change_password: {type: boolean}
            tokens_revoked:
              type: integer
              description: Presente al cambiar la contraseña.
    DeviceToken:
      type: object
      required: [id, name, created_at, last_used_at, expires_at]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estable en inglés, para ramificar en el cliente.
              examples: [VALIDATION_FAILED, FORBIDDEN, VERSION_CONFLICT]
            message:
              type: string
              description: Mensaje para el usuario final, en español.
            fields:
              type: object
              additionalProperties:
                type: string
        request_id:
          type: string

    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          description: Total de filas que cumplen el filtro.
        limit:
          type: integer
          description: Tamaño de página aplicado (máximo 100).
        offset:
          type: integer
          description: Desplazamiento aplicado.

    RoleRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
          enum: [ADMINISTRADOR, LIDER_PROYECTO, COLABORADOR]
        name:
          type: string

    User:
      type: object
      required: [id, name, email, role, active, must_change_password, version]
      description: Cuenta serializada sin `password_hash` ni secretos.
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        job_title:
          type: [string, 'null']
        timezone:
          type: string
          description: Zona IANA usada solo para presentación.
        role:
          $ref: '#/components/schemas/RoleRef'
        avatar_url:
          type: [string, 'null']
        notification_prefs:
          type: object
          additionalProperties: true
        active:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time
        version:
          type: string

    UserDirectoryEntry:
      type: object
      required: [id, name, role]
      description: Datos mínimos para asignaciones e invitaciones; solo activos.
      properties:
        id:
          type: string
        name:
          type: string
        job_title:
          type: [string, 'null']
        role:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [ADMINISTRADOR, LIDER_PROYECTO, COLABORADOR]

    UserCreate:
      type: object
      required: [name, email, password]
      description: |
        Indica `role` (código) o `role_id`. Un campo sensible desconocido se
        rechaza con 422. La cuenta nace con `must_change_password = 1`.
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          minLength: 12
          maxLength: 200
        phone:
          type: [string, 'null']
          maxLength: 32
        job_title:
          type: [string, 'null']
          maxLength: 120
        timezone:
          type: string
          default: America/Mexico_City
        role:
          type: string
          enum: [ADMINISTRADOR, LIDER_PROYECTO, COLABORADOR]
        role_id:
          type: string
          pattern: '^[0-9]+$'

    UserUpdate:
      type: object
      required: [version]
      description: |
        Solo estos campos son editables. `email`, `active`, `password` y
        `password_hash` se rechazan con 422. El propio actor no puede cambiar su
        rol (403).
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 32
        job_title:
          type: [string, 'null']
          maxLength: 120
        timezone:
          type: string
        role:
          type: string
          enum: [ADMINISTRADOR, LIDER_PROYECTO, COLABORADOR]
        role_id:
          type: string
          pattern: '^[0-9]+$'
        version:
          type: string
          pattern: '^[0-9]+$'

    TemporaryPasswordResponse:
      type: object
      required: [user, temporary_password]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type: string
          description: Clave temporal de un solo uso; se muestra solo en esta respuesta.

    Client:
      type: object
      required: [id, type, name, active]
      description: |
        `representative_name`, `email`, `address`, `notes`, `created_by`,
        `version`, `created_at` y `updated_at` solo aparecen si el actor es ADMIN
        (`clients.viewSensitive`) o el creador del registro.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [NORMAL, BANDA]
        name:
          type: string
        contact_name:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        active:
          type: boolean
        representative_name:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        address:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        created_by:
          type: [string, 'null']
        version:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    ClientCreate:
      type: object
      required: [name]
      description: |
        Una BANDA exige `representative_name` y `phone`. `type` vale NORMAL si se
        omite. Los duplicados se advierten en `meta.warnings`, sin bloquear.
      properties:
        type:
          type: string
          enum: [NORMAL, BANDA]
          default: NORMAL
        name:
          type: string
          maxLength: 160
        contact_name:
          type: [string, 'null']
          maxLength: 120
        representative_name:
          type: [string, 'null']
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 32
        email:
          type: [string, 'null']
          format: email
          maxLength: 180
        address:
          type: [string, 'null']
          maxLength: 255
        notes:
          type: [string, 'null']
          maxLength: 5000

    ClientUpdate:
      type: object
      required: [version]
      description: |
        ADMIN edita todo. El creador solo `contact_name`, `phone`, `email`,
        `address` y `representative_name` de sus registros. `type` es exclusivo
        de ADMIN. `active`, `created_by`, `id` y fechas se rechazan con 422.
      properties:
        type:
          type: string
          enum: [NORMAL, BANDA]
        name:
          type: string
          maxLength: 160
        contact_name:
          type: [string, 'null']
          maxLength: 120
        representative_name:
          type: [string, 'null']
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 32
        email:
          type: [string, 'null']
          format: email
          maxLength: 180
        address:
          type: [string, 'null']
          maxLength: 255
        notes:
          type: [string, 'null']
          maxLength: 5000
        version:
          type: string
          pattern: '^[0-9]+$'

    DuplicateWarning:
      type: object
      required: [id, name, matched_by]
      properties:
        id:
          type: string
        name:
          type: string
        matched_by:
          type: array
          items:
            type: string
            enum: [name, phone, email]

    ClientCreateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Client'
        meta:
          type: object
          properties:
            warnings:
              type: array
              description: Posibles duplicados; se omite si no hay ninguno.
              items:
                $ref: '#/components/schemas/DuplicateWarning'

  parameters:
    ReservationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Obligatoria en TODA escritura de reservas y bloqueos, incluidas notas,
        transiciones y cancelaciones. ASCII imprimible sin espacios, 1–100.
        Alcance actor+operación; misma clave y petición devuelve resultado original
        tras reautorizar acceso actual. Contenido distinto da 409 IDEMPOTENCY_KEY_REUSED.
        Efecto y respuesta se persisten en la misma transacción; replay no crea otra venta.
      schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[!-~]+$'}
      example: reserva-20261102-001
    ReservationSearch:
      name: q
      in: query
      description: Búsqueda de texto dentro de los objetos autorizados; no amplía visibilidad.
      schema: {type: string, maxLength: 120}
    ReservationStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/ReservationStatus'}
    ReservationSpaceFilter:
      name: space_id
      in: query
      schema: {$ref: '#/components/schemas/ProjectId'}
    ReservationBandFilter:
      name: band_client_id
      in: query
      schema: {$ref: '#/components/schemas/ProjectId'}
    ReservationFrom:
      name: from
      in: query
      description: Instante inferior inclusivo para solape, no DATE; con to exige to mayor que from.
      schema: {$ref: '#/components/schemas/FinanceTimestamp'}
      example: '2026-11-02T00:00:00-06:00'
    ReservationTo:
      name: to
      in: query
      description: Instante superior exclusivo para solape, no DATE.
      schema: {$ref: '#/components/schemas/FinanceTimestamp'}
      example: '2026-11-03T00:00:00-06:00'
    AvailabilityFrom:
      name: from
      in: query
      required: true
      description: Inicio inclusivo ISO con zona; rango positivo máximo 31 días.
      schema: {$ref: '#/components/schemas/FinanceTimestamp'}
      example: '2026-11-02T00:00:00-06:00'
    AvailabilityTo:
      name: to
      in: query
      required: true
      description: Fin exclusivo ISO con zona; posterior a from, máximo 31 días.
      schema: {$ref: '#/components/schemas/FinanceTimestamp'}
      example: '2026-11-03T00:00:00-06:00'
    CatalogSearch:
      name: q
      in: query
      description: Búsqueda por nombre; no permite SQL ni orden arbitrario.
      schema: {type: string, maxLength: 120}
    CatalogActive:
      name: active
      in: query
      description: Solo ADMIN puede incluir inactivos; otros siempre consultan activos.
      schema: {type: string, enum: ['0', '1']}
    FinanceIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave HTTP original ASCII imprimible sin espacios, 1–100 caracteres.
        Alcance actor+operación; hash de petición canónica con ruta, cuerpo y versión
        cuando corresponda. Misma clave y contenido devuelve resultado original;
        distinto contenido da 409 IDEMPOTENCY_KEY_REUSED. Solicitud, efecto y respuesta
        comparten transacción. Replay exige autorización actual sobre el objeto,
        también con Bearer. Nunca se devuelve la clave ni el hash privado del ledger.
      schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[!-~]+$'}
      example: venta-20261028-001
    SaleEditIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Obligatoria en PATCH de venta con items (incluso lista vacía); no exigida
        al cambiar solo notes/client_id. Mismas reglas transaccionales, de replay
        y reautorización que FinanceIdempotencyKey.
      schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[!-~]+$'}
    PaymentIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Versión opcional del documento origen (venta/proyecto), no del pago.
        Alternativa a version/expected_version del cuerpo. Si se envían varias
        fuentes deben coincidir; formato/desacuerdo 422, obsoleta 409 VERSION_CONFLICT.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      example: '"3"'
    ProjectResourceId:
      name: id
      in: path
      required: true
      description: Identificador del recurso de la ruta; no otorga acceso al objeto.
      schema: {$ref: '#/components/schemas/ProjectId'}
    ProjectSearch:
      name: q
      in: query
      description: Nombre/folio para proyectos; título para tareas.
      schema: {type: string, maxLength: 120}
    TaskStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/TaskStatus'}
    TaskAssigneeFilter:
      name: assignee_id
      in: query
      description: Responsable; no amplía visibilidad por objeto.
      schema: {$ref: '#/components/schemas/ProjectId'}
    ProjectIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Versión entre comillas, alternativa a version/expected_version del cuerpo.
        Al menos una fuente obligatoria; varias deben coincidir. Ausencia, formato
        incorrecto o desacuerdo da 422; obsoleta da 409 VERSION_CONFLICT.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      example: '"3"'
    ProjectIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Obligatorio en escrituras de cargos. ASCII imprimible sin espacios, 1–100.
        Alcance actor+operación; mismo contenido devuelve resultado original;
        distinto contenido da 409 IDEMPOTENCY_KEY_REUSED. Efecto y respuesta
        se guardan en la misma transacción.
      schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[!-~]+$'}
      example: proyecto-cargo-20261028-001
    ProjectIdempotencyConditional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Obligatorio al crear proyecto con valor/importe y en PATCH con campos
        financieros (base_amount, billable, client_id o type); no requerido para
        edición no financiera. ASCII imprimible sin espacios, 1–100. Repetir
        clave/cuerpo devuelve resultado original; cambiar cuerpo da 409
        IDEMPOTENCY_KEY_REUSED. Efecto y respuesta en la misma transacción.
      schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[!-~]+$'}
      example: proyecto-20261028-001
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Obligatorio en TODA escritura con cookie (incluido login); no con Bearer válido.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        description: Versión esperada entre comillas, por ejemplo "3".
    UserId:
      name: id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        pattern: '^[0-9]+$'
    ClientId:
      name: id
      in: path
      required: true
      description: Identificador del cliente.
      schema:
        type: string
        pattern: '^[0-9]+$'

  responses:
    SpaceResource:
      description: Espacio con ventanas semanales; tarifa solo ADMIN.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Space'}
    SpacePage:
      description: Página de espacios; sin hours, tarifa solo ADMIN.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/Space'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    SpaceAvailabilityResource:
      description: |
        Calendario mínimo en rango acotado, no paginado; guaranteed=false.
        Sin datos financieros ni del cliente; ventanas no garantizan disponibilidad.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/SpaceAvailability'}
          example:
            data:
              space_id: '2'
              timezone: America/Mexico_City
              windows: [{start_at: '2026-11-02T15:00:00Z', end_at: '2026-11-03T00:00:00Z'}]
              occupancies: [{id: '9', space_id: '2', start_at: '2026-11-02T16:00:00Z', end_at: '2026-11-02T17:30:00Z', kind: RESERVATION, status: CONFIRMED}]
              guaranteed: false
    ReservationResource:
      description: |
        Reserva autorizada y financial_summary del ledger único de venta.
        IDs/version strings, importes strings con dos decimales, instantes UTC Z.
        Replay reautoriza acceso actual; no devuelve datos de una reserva ya invisible.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Reservation'}
    ReservationPage:
      description: Página autorizada; ADMIN todas, demás solo propias; sin financial_summary de detalle.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/Reservation'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    SpaceBlockResource:
      description: Bloqueo administrativo con motivo; no genera documento financiero.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/SpaceBlock'}
    SpaceBlockPage:
      description: Bloqueos paginados, exclusivamente ADMIN.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/SpaceBlock'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    ReservationAgendaPage:
      description: Eventos mínimos propios sin cancelados; no modifica meta ni eventos de /agenda.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ReservationAgendaEntry'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
          example:
            data: [{id: '4', reservation_id: '4', kind: RESERVATION, title: 'Reserva · Sala principal', start_at: '2026-11-02T16:00:00Z', end_at: '2026-11-02T17:30:00Z', status: CONFIRMED, space_id: '2'}]
            meta: {total: 1, limit: 25, offset: 0}
    ReservationConflict:
      description: |
        Códigos estables (ramificar por code, nunca message): VERSION_CONFLICT
        (versión obsoleta), RESERVATION_CONFLICT (solapamiento bloqueante),
        SPACE_INACTIVE (espacio desactivado), SPACE_HAS_FUTURE_OCCUPANCIES (resolver
        ocupaciones antes de cambiar configuración), RESERVATION_STATE_CONFLICT
        (estado incompatible), OVERPAYMENT (nuevo total inferior al neto cobrado),
        PAYMENTS_REQUIRE_RESOLUTION (neto no cero al cancelar),
        IDEMPOTENCY_KEY_REUSED (misma clave con otra petición).
        No incluye banda, notas, importes ni IDs sensibles de ocupaciones ajenas.
        Campos desconocidos, horario inválido, versión ausente/incoherente o clave
        idempotente ausente producen 422 VALIDATION_FAILED; invisibles, 404 NOT_FOUND.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: RESERVATION_CONFLICT, message: El espacio está ocupado en ese intervalo., fields: {}}
            request_id: 1234567890abcdef
    ProductResource:
      description: Producto autorizado con extra_ids; precio como string y active boolean.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Product'}
    ProductPage:
      description: Productos autorizados paginados; sin extra_ids de detalle.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/Product'}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    ExtraResource:
      description: Extra de catálogo autorizado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Extra'}
    ExtraPage:
      description: Extras autorizados paginados.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/Extra'}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    SaleResource:
      description: Venta propia o autorizada para ADMIN con partidas y resumen del ledger.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Sale'}
    SalePage:
      description: Ventas autorizadas, solo escalares; borradores con total vigente.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/SaleSummary'}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    PaymentPage:
      description: Historial financiero autorizado de venta, incluidos pagos anulados.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/Payment'}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    RefundPage:
      description: Historial paginado autorizado de reembolsos del pago.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/Refund'}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    PaymentMutation:
      description: |
        Movimiento registrado y resumen actual; versión del documento actualizada.
        mark-paid con saldo cero devuelve payment=null sin insertar asiento ficticio.
        Replay devuelve el resultado original únicamente tras reautorizar acceso actual.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/PaymentMutationResult'}
    FinanceConflict:
      description: |
        code estable según la regla, nunca ramificar por message:
        VERSION_CONFLICT (versión obsoleta), IDEMPOTENCY_KEY_REUSED (otra petición
        con la misma clave), SKU_CONFLICT (SKU duplicado), SALE_NOT_DRAFT
        (venta inmutable), SALE_CANCELLED (ya cancelada), RESERVATION_MANAGED
        (gestión coordinada desde reserva), PAYMENTS_REQUIRE_RESOLUTION (neto
        cobrado impide cancelar), CLIENT_INACTIVE (cobro de proyecto sin cliente
        activo), OVERPAYMENT (importe supera saldo), PAYMENT_VOIDED (pago anulado),
        PAYMENT_HAS_REFUNDS (anulación con reembolsos activos), REFUND_EXCEEDS_PAYMENT
        (supera remanente reembolsable), PAYMENT_DOCUMENT_CHANGED (origen cambió;
        reintentar). No incluye importes ni datos financieros de objetos ajenos.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: OVERPAYMENT, message: El pago supera el saldo pendiente., fields: {}}
            request_id: 1234567890abcdef
    ProjectResource:
      description: Proyecto con versión actual y campos financieros recortados según solicitante.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Project'}
    ProjectPage:
      description: Proyectos visibles paginados, con recorte financiero por objeto.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/Project'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    ProjectMemberPage:
      description: Integrantes paginados y versión actual del proyecto.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ProjectMember'}}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    ProjectStageResource:
      description: Etapa con su versión actual y avance calculado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ProjectStage'}
    ProjectStagePage:
      description: Etapas ordenadas paginadas y versión actual del proyecto.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ProjectStage'}}
              meta: {$ref: '#/components/schemas/ProjectPaginationMeta'}
    TaskResource:
      description: Tarea con versión actual; sin campos financieros del proyecto.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Task'}
    TaskPage:
      description: Tareas visibles paginadas, sin importes ni notas financieras del proyecto.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/Task'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    TaskCommentResource:
      description: Comentario inmutable con autor y timestamp UTC del servidor.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/TaskComment'}
    TaskCommentPage:
      description: Comentarios paginados por fecha e ID.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/TaskComment'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    ProjectChargeResource:
      description: Cargo con importe calculado y versión actual; no registra cobro ni gasto.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ProjectCharge'}
    ProjectChargePage:
      description: Cargos paginados, resumen financiero y versión del proyecto; solo ADMIN/líder dueño.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ProjectCharge'}}
              meta:
                allOf:
                  - $ref: '#/components/schemas/ProjectPaginationMeta'
                  - type: object
                    required: [summary]
                    properties:
                      summary: {$ref: '#/components/schemas/ProjectFinancialSummary'}
    ProjectPaymentPage:
      description: Historial de pagos y resumen financiero; solo ADMIN/líder dueño.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ProjectPayment'}}
              meta:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [summary]
                    properties:
                      summary: {$ref: '#/components/schemas/ProjectFinancialSummary'}
    TaskAgendaPage:
      description: Proyección propia de tareas de día completo; solo fase 2.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/TaskAgendaEntry'}}
              meta:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [projection]
                    properties:
                      projection: {type: string, const: TASKS_PHASE_2}
    ProjectForbidden:
      description: |
        FORBIDDEN por rol/objeto, CSRF_INVALID para cookie o PASSWORD_CHANGE_REQUIRED.
        Sin importes, notas privadas ni resumen financiero en campos/mensaje;
        mismo recorte con Bearer. Objetos no visibles producen 404 NOT_FOUND.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: FORBIDDEN, message: No tienes permiso para esta acción.}
            request_id: 3f9c2a1b7d8e4f60
    ProjectConflict:
      description: |
        Códigos estables de fase 2: VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED,
        INVALID_TRANSITION, REQUIRED_TASKS_INCOMPLETE, MEMBER_HAS_TASKS,
        PROJECT_CLOSED, STAGE_CLOSED, TASK_CLOSED y TOTAL_BELOW_PAID.
        Sin importes ni valores financieros ajenos en errores.
        Campos desconocidos, fechas, versión ausente/incoherente o clave ausente
        cuando es obligatoria producen 422 VALIDATION_FAILED, no 409.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: VERSION_CONFLICT, message: El registro cambió. Recárgalo antes de continuar.}
            request_id: 3f9c2a1b7d8e4f60
    Session:
      description: Perfil propio sin secretos y capacidades informativas; el backend reautoriza siempre.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SessionEnvelope'}
    InvalidCredentials:
      description: INVALID_CREDENTIALS genérico, sin revelar si la cuenta existe o está activa.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AccessForbidden:
      description: CSRF_INVALID, PASSWORD_CHANGE_REQUIRED o FORBIDDEN según el caso.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: RATE_LIMITED por cuenta o IP, con Retry-After en segundos.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: Sin sesión ni token válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Necesitas iniciar sesión.
            request_id: 3f9c2a1b7d8e4f60
    Forbidden:
      description: El rol o el objeto no autorizan la acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: No tienes permiso para esta acción.
            request_id: 3f9c2a1b7d8e4f60
    NotFound:
      description: El recurso no existe o no es visible para el actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: No encontrado.
            request_id: 3f9c2a1b7d8e4f60
    Conflict:
      description: |
        Conflicto de negocio o de concurrencia. Códigos estables:
        `VERSION_CONFLICT`, `EMAIL_TAKEN`, `LAST_ADMIN_PROTECTED`,
        `CLIENT_HAS_FUTURE_RESERVATIONS`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VERSION_CONFLICT
              message: El registro cambió mientras lo editabas.
              fields:
                version: La versión enviada ya no es la actual.
            request_id: 3f9c2a1b7d8e4f60
    ValidationFailed:
      description: Uno o más campos no cumplen la lista blanca o el formato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: Revisa los datos enviados.
              fields:
                email: El correo es obligatorio y debe ser una dirección válida.
            request_id: 3f9c2a1b7d8e4f60
